<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Calculator</title>

  <!-- Tailwind CSS via CDN (requires internet access) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <main class="min-h-screen flex items-center justify-center p-4">
    <section class="calculator-card w-full max-w-xl rounded-3xl bg-white p-6 sm:p-8 shadow-xl">
      <div class="text-center mb-7">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-100 text-indigo-700 text-2xl mb-3" aria-hidden="true">📘</div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900">Grade Calculator</h1>
        <p class="mt-2 text-slate-500">Enter your marks to calculate your percentage and grade.</p>
      </div>

      <form id="gradeForm" class="space-y-5">
        <div>
          <label for="studentName" class="block text-sm font-semibold mb-2">Student name <span class="font-normal text-slate-400">(optional)</span></label>
          <input id="studentName" type="text" placeholder="Enter your name" class="field w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-400">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="obtainedMarks" class="block text-sm font-semibold mb-2">Obtained marks</label>
            <input id="obtainedMarks" type="number" min="0" step="any" required placeholder="e.g. 420" class="field w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <div>
            <label for="totalMarks" class="block text-sm font-semibold mb-2">Total marks</label>
            <input id="totalMarks" type="number" min="1" step="any" required placeholder="e.g. 500" value="500" class="field w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
        </div>

        <p id="errorMessage" class="hidden text-sm font-medium text-red-600" role="alert"></p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
          <button type="submit" class="w-full rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white shadow hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2">Calculate Grade</button>
          <button type="button" id="resetButton" class="w-full rounded-xl bg-slate-100 px-5 py-3 font-bold text-slate-700 hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-300">Reset</button>
        </div>
      </form>

      <section id="resultCard" class="hidden mt-7 rounded-2xl border border-indigo-100 bg-indigo-50 p-5" aria-live="polite">
        <p id="greeting" class="text-sm font-semibold text-indigo-700"></p>
        <div class="mt-3 grid grid-cols-2 gap-4">
          <div>
            <p class="text-xs uppercase tracking-wider text-slate-500">Percentage</p>
            <p id="percentageResult" class="mt-1 text-3xl font-extrabold text-slate-900">0%</p>
          </div>
          <div>
            <p class="text-xs uppercase tracking-wider text-slate-500">Grade</p>
            <p id="gradeResult" class="mt-1 text-3xl font-extrabold text-indigo-700">-</p>
          </div>
        </div>
        <div class="mt-4 h-3 overflow-hidden rounded-full bg-white">
          <div id="progressBar" class="h-full rounded-full bg-indigo-600 transition-all duration-500" style="width: 0%"></div>
        </div>
        <p id="remarkResult" class="mt-3 text-sm text-slate-600"></p>
      </section>

      <p class="mt-6 text-center text-xs text-slate-400">Grade scale used: A (80%+), B (70%+), C (60%+), D (50%+), F (below 50%).</p>
    </section>
  </main>
</body>
</html>
